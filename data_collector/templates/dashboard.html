<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tekthib Simulation Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #333;
        padding: 20px;
      }
      .container {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }
      header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }
      h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
      }
      .subtitle {
        opacity: 0.9;
        font-size: 1.1em;
      }
      .controls {
        display: flex;
        gap: 15px;
        justify-content: center;
        padding: 25px;
        background: #f7f7f7;
        border-bottom: 2px solid #ddd;
      }
      button {
        padding: 12px 30px;
        font-size: 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 600;
      }
      .btn-start {
        background: #4caf50;
        color: white;
      }
      .btn-start:hover {
        background: #45a049;
      }
      .btn-stop {
        background: #f44336;
        color: white;
      }
      .btn-stop:hover {
        background: #da190b;
      }
      .btn-refresh {
        background: #2196f3;
        color: white;
      }
      .btn-refresh:hover {
        background: #0b7dda;
      }
      .btn-download {
        background: #ff9800;
        color: white;
      }
      .btn-download:hover {
        background: #e68900;
      }
      .content {
        padding: 30px;
      }
      .section {
        margin-bottom: 30px;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 8px;
        border-left: 4px solid #667eea;
      }
      .section h2 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 1.5em;
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 15px;
      }
      .stat-card {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      .stat-value {
        font-size: 2em;
        font-weight: bold;
        color: #667eea;
        margin-bottom: 5px;
      }
      .stat-label {
        color: #666;
        font-size: 0.9em;
      }
      .strategy-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 15px;
        background: white;
        border-radius: 8px;
        overflow: hidden;
      }
      .strategy-table th {
        background: #667eea;
        color: white;
        padding: 12px;
        text-align: left;
      }
      .strategy-table td {
        padding: 10px 12px;
        border-bottom: 1px solid #ddd;
      }
      .strategy-table tr:hover {
        background: #f5f5f5;
      }
      .active-games {
        list-style: none;
      }
      .active-game {
        padding: 10px;
        margin: 8px 0;
        background: white;
        border-radius: 6px;
        border-left: 3px solid #4caf50;
      }
      .status-badge {
        display: inline-block;
        padding: 5px 15px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 0.9em;
      }
      .status-running {
        background: #4caf50;
        color: white;
      }
      .status-stopped {
        background: #f44336;
        color: white;
      }
      .loading {
        text-align: center;
        padding: 20px;
        color: #666;
      }
      footer {
        text-align: center;
        padding: 20px;
        color: #666;
        border-top: 1px solid #ddd;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🎮 Tekthib Simulation Dashboard</h1>
        <p class="subtitle">Automated Bot Performance Tracking & Analysis</p>
      </header>

      <div class="controls">
        <button class="btn-start" onclick="startSimulation()">
          ▶️ Start Simulation
        </button>
        <button class="btn-stop" onclick="stopSimulation()">
          ⏹️ Stop Simulation
        </button>
        <button class="btn-refresh" onclick="loadData()">🔄 Refresh</button>
        <button class="btn-download" onclick="downloadData()">
          📥 Download Data
        </button>
      </div>

      <div class="content">
        <!-- Status Section -->
        <div class="section">
          <h2>📊 Simulation Status</h2>
          <div id="status-content" class="loading">Loading...</div>
        </div>

        <!-- Analytics Section -->
        <div class="section">
          <h2>📈 Performance Analytics</h2>
          <div id="analytics-content" class="loading">Loading...</div>
        </div>

        <!-- Active Games Section -->
        <div class="section">
          <h2>🎯 Active Games</h2>
          <div id="active-games-content" class="loading">Loading...</div>
        </div>
      </div>

      <footer>
        <p>Tekthib Simulation Server v1.0.0 | Built with FastAPI & Love 💜</p>
      </footer>
    </div>

    <script>
      async function startSimulation() {
        try {
          const response = await fetch("/start", { method: "POST" });
          const data = await response.json();
          alert(data.message || "Simulation started!");
          loadData();
        } catch (error) {
          alert("Error starting simulation: " + error.message);
        }
      }

      async function stopSimulation() {
        try {
          const response = await fetch("/stop", { method: "POST" });
          const data = await response.json();
          alert(data.message || "Simulation stopped!");
          loadData();
        } catch (error) {
          alert("Error stopping simulation: " + error.message);
        }
      }

      async function downloadData() {
        window.location.href = "/download";
      }

      async function loadData() {
        await Promise.all([loadStatus(), loadAnalytics()]);
      }

      async function loadStatus() {
        try {
          const response = await fetch("/status");
          const data = await response.json();

          const statusHtml = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${
                              data.running ? "🟢" : "🔴"
                            }</div>
                            <div class="stat-label">Status</div>
                            <span class="status-badge ${
                              data.running ? "status-running" : "status-stopped"
                            }">
                                ${data.running ? "Running" : "Stopped"}
                            </span>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${
                              data.completed_games
                            }</div>
                            <div class="stat-label">Completed Games</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.active_games}</div>
                            <div class="stat-label">Active Games</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${
                              data.strategies.length
                            }</div>
                            <div class="stat-label">Strategies</div>
                        </div>
                    </div>
                `;
          document.getElementById("status-content").innerHTML = statusHtml;

          // Active games list
          let activeGamesHtml = "";
          if (data.active_games_list && data.active_games_list.length > 0) {
            activeGamesHtml = '<ul class="active-games">';
            data.active_games_list.forEach((game) => {
              activeGamesHtml += `
                            <li class="active-game">
                                <strong>Room:</strong> ${game.room_code} | 
                                <strong>Strategies:</strong> ${game.strategies.join(
                                  ", "
                                )} | 
                                <strong>Started:</strong> ${new Date(
                                  game.start_time
                                ).toLocaleTimeString()}
                            </li>
                        `;
            });
            activeGamesHtml += "</ul>";
          } else {
            activeGamesHtml =
              '<p style="color: #666; text-align: center;">No active games</p>';
          }
          document.getElementById("active-games-content").innerHTML =
            activeGamesHtml;
        } catch (error) {
          document.getElementById("status-content").innerHTML =
            '<p style="color: red;">Error loading status</p>';
        }
      }

      async function loadAnalytics() {
        try {
          const response = await fetch("/analyze");
          const data = await response.json();

          if (data.total_games === 0) {
            document.getElementById("analytics-content").innerHTML =
              '<p style="color: #666; text-align: center;">No data yet. Start some simulations!</p>';
            return;
          }

          const analyticsHtml = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${data.total_games}</div>
                            <div class="stat-label">Total Games</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.avg_duration.toFixed(
                              1
                            )}s</div>
                            <div class="stat-label">Avg Duration</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.avg_rounds.toFixed(
                              1
                            )}</div>
                            <div class="stat-label">Avg Rounds</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.challenge_success_rate.toFixed(
                              1
                            )}%</div>
                            <div class="stat-label">Challenge Success Rate</div>
                        </div>
                    </div>
                    
                    <h3 style="margin-top: 25px; margin-bottom: 10px; color: #667eea;">Strategy Performance</h3>
                    <table class="strategy-table">
                        <thead>
                            <tr>
                                <th>Strategy</th>
                                <th>Wins</th>
                                <th>Games</th>
                                <th>Win Rate</th>
                                <th>Avg Duration</th>
                                <th>Avg Rounds</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${Object.entries(data.strategy_stats)
                              .map(
                                ([strategy, stats]) => `
                                <tr>
                                    <td><strong>${strategy}</strong></td>
                                    <td>${stats.wins}</td>
                                    <td>${stats.games}</td>
                                    <td><strong>${stats.win_rate.toFixed(
                                      1
                                    )}%</strong></td>
                                    <td>${stats.avg_duration.toFixed(1)}s</td>
                                    <td>${stats.avg_rounds.toFixed(1)}</td>
                                </tr>
                            `
                              )
                              .join("")}
                        </tbody>
                    </table>
                `;
          document.getElementById("analytics-content").innerHTML =
            analyticsHtml;
        } catch (error) {
          document.getElementById("analytics-content").innerHTML =
            '<p style="color: red;">Error loading analytics</p>';
        }
      }

      // Auto-refresh every 5 seconds
      setInterval(loadData, 5000);

      // Initial load
      loadData();
    </script>
  </body>
</html>
